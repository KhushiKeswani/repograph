        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#7ed321", "font": {"color": "white"}, "id": "bot.py::lifespan", "label": "lifespan", "shape": "dot", "size": 15, "title": "function: lifespan \u2014 bot.py"}, {"color": "#7ed321", "font": {"color": "white"}, "id": "database.py::init_db", "label": "init_db", "shape": "dot", "size": 15, "title": "function: init_db \u2014 database.py"}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "#c0392b", "from": "bot.py::lifespan", "title": "CALLS", "to": "database.py::init_db"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"interaction": {"hover": true, "selectConnectedEdges": true, "hoverConnectedEdges": true, "navigationButtons": true, "zoomView": true, "dragView": true}, "physics": {"enabled": true, "hierarchicalRepulsion": {"nodeDistance": 150, "centralGravity": 0.0, "springLength": 150, "springConstant": 0.01, "damping": 0.09}, "solver": "hierarchicalRepulsion"}, "layout": {"hierarchical": {"enabled": true, "direction": "UD", "sortMethod": "directed", "nodeSpacing": 150, "levelSeparation": 180}}, "nodes": {"font": {"size": 18}}, "edges": {"smooth": {"enabled": true, "type": "cubicBezier", "forceDirection": "vertical", "roundness": 0.4}, "arrows": {"to": {"enabled": true, "scaleFactor": 0.7}}}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
